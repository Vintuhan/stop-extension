name: Обновление списка

on:
  schedule:
    - cron: "17 3 * * *"   # каждый день в 03:17 UTC
  workflow_dispatch:        # и кнопка «Run workflow» вручную

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # необязательно; без ключа шаг с нейросетью просто пропускается
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверка новых доменов нейросетью
        run: python tools/classify_domains.py
      - name: Пересборка blocklist.json
        run: python tools/update_blocklist.py
      - name: Сохранить изменения
        run: |
          git config user.name "blocklist-bot"
          git config user.email "blocklist-bot@users.noreply.github.com"
          git add blocklist.json tools/llm_results.json
          if ! git diff --cached --quiet; then
            git commit -m "Обновление списка"
            git push
          fi
